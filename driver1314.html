
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คนขับรถสองแถวสาย 1314</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      width: min(900px, 94%);
      margin: 20px auto;
    }

    .header, .status, .info {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .header {
      text-align: center;
      padding: 22px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .status {
      text-align: center;
      font-weight: bold;
    }

    .success { color: #16803c; }
    .error { color: #d62828; }
    .warning { color: #b77900; }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #startBtn { background: #198754; color: white; }
    #stopBtn { background: #dc3545; color: white; }
    #locateBtn {
      width: 100%;
      background: #0d6efd;
      color: white;
      margin-bottom: 12px;
    }

    .info {
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .info strong { color: #333; }

    #map {
      width: 100%;
      height: 560px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    .vehicle-wrapper {
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform .4s ease;
    }

    .vehicle-svg {
      width: 58px;
      height: 58px;
      display: block;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,.35));
    }

    .route-label {
      background: white;
      border: 2px solid #1976d2;
      border-radius: 8px;
      padding: 5px 9px;
      font-weight: bold;
      color: #1565c0;
      box-shadow: 0 2px 7px rgba(0,0,0,.2);
    }

    @media (max-width: 600px) {
      .container {
        width: 96%;
        margin: 10px auto;
      }

      .header h1 { font-size: 23px; }
      .buttons { grid-template-columns: 1fr; }
      #map { height: 480px; }
    }
  </style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>🚐 รถสองแถวสาย 1314</h1>
    <p>ระบบแชร์ตำแหน่ง GPS สำหรับคนขับ</p>
  </div>

  <div id="status" class="status warning">
    🟡 กำลังเชื่อมต่อ Firebase...
  </div>

  <div class="buttons">
    <button id="startBtn">▶️ เริ่มแชร์ตำแหน่ง</button>
    <button id="stopBtn" disabled>⏹️ หยุดแชร์ตำแหน่ง</button>
  </div>

  <button id="locateBtn">📍 ดูตำแหน่งปัจจุบัน</button>

  <div class="info">
    <div><strong>สถานะ GPS:</strong> <span id="gpsStatus">ยังไม่ได้เริ่ม</span></div>
    <div><strong>ละติจูด:</strong> <span id="latText">-</span></div>
    <div><strong>ลองจิจูด:</strong> <span id="lngText">-</span></div>
    <div><strong>ความเร็ว:</strong> <span id="speedText">-</span></div>
    <div><strong>ทิศทาง:</strong> <span id="headingText">-</span></div>
    <div><strong>ความแม่นยำ GPS:</strong> <span id="accuracyText">-</span></div>
    <div><strong>อัปเดตล่าสุด:</strong> <span id="timeText">-</span></div>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDm1Dn4GcE7EFLS-O0aMCLlU40xx86dmg4",
  authDomain: "checkrod-1524.firebaseapp.com",
  databaseURL: "https://checkrod-1524-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "checkrod-1524",
  storageBucket: "checkrod-1524.firebasestorage.app",
  messagingSenderId: "894686328246",
  appId: "1:894686328246:web:9690cf10d8dbcf91c5fd17",
  measurementId: "G-53PLWF1K0F"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;
let watchId = null;
let vehicleMarker = null;
let lastPosition = null;
let lastHeading = 0;

/*
  สำคัญ:
  ใช้ vehicles/1524 ตามเดิม
  เพื่อให้ตรงกับหน้าผู้โดยสารที่อ่าน path นี้
*/
const vehicleRef = ref(db, "vehicles/1524");

const $ = id => document.getElementById(id);

function setStatus(message, type = "warning") {
  $("status").textContent = message;
  $("status").className = "status " + type;
}

/* MAP */
const map = L.map("map").setView([13.74570, 100.70119], 13);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

/*
  ROUTE 1314
  หมู่บ้านนักกีฬาแหลมทอง - สวนสน - เดอะมอลล์บางกะปิ

  พิกัดเป็นจุดหลักจากโค้ดหน้าผู้โดยสารที่ให้มา
  OSRM จะคำนวณเส้นถนนเชื่อมระหว่างจุดเหล่านี้
*/
const routeWaypoints = [
  [13.74570, 100.70119], // หมู่บ้านนักกีฬาแหลมทอง
  [13.75776, 100.65081], // สวนสน
  [13.76614, 100.64266]  // เดอะมอลล์บางกะปิ
];

/* DRAW ROAD ROUTE */
async function createRealRoadRoute() {
  try {
    setStatus("🟡 กำลังโหลดเส้นทางถนนสาย 1314...", "warning");

    const coordinates = routeWaypoints
      .map(point => `${point[1]},${point[0]}`)
      .join(";");

    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      coordinates +
      "?overview=full&geometries=geojson";

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("ไม่สามารถโหลดเส้นทางได้");
    }

    const result = await response.json();

    if (!result.routes || !result.routes.length) {
      throw new Error("ไม่พบเส้นทาง");
    }

    const roadCoordinates = result.routes[0].geometry.coordinates
      .map(point => [point[1], point[0]]);

    L.polyline(roadCoordinates, {
      color: "#1976d2",
      weight: 7,
      opacity: 0.9,
      lineCap: "round",
      lineJoin: "round"
    }).addTo(map).bindTooltip("🚐 เส้นทางรถสองแถวสาย 1314", {
      permanent: true,
      direction: "center",
      className: "route-label"
    });

    L.marker(routeWaypoints[0]).addTo(map)
      .bindPopup("🚐 หมู่บ้านนักกีฬาแหลมทอง — จุดเริ่มต้นสาย 1314");

    L.marker(routeWaypoints[1]).addTo(map)
      .bindPopup("🚏 สวนสน");

    L.marker(routeWaypoints[2]).addTo(map)
      .bindPopup("🏁 เดอะมอลล์บางกะปิ — จุดปลายทางสาย 1314");

    map.fitBounds(L.latLngBounds(roadCoordinates), {
      padding: [30, 30]
    });

    setStatus("🟢 โหลดเส้นทางสาย 1314 สำเร็จ", "success");

  } catch (error) {
    console.error("Route Error:", error);
    setStatus(
      "🟡 โหลดเส้นทางถนนไม่สำเร็จ แต่ GPS ยังใช้งานได้",
      "warning"
    );
  }
}

/* VEHICLE ICON */
const vehicleIcon = L.divIcon({
  className: "",
  html: `
    <div id="vehicleWrapper" class="vehicle-wrapper">
      <svg class="vehicle-svg" viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="91" rx="28" ry="5"
                 fill="rgba(0,0,0,0.20)"/>
        <rect x="25" y="15" width="50" height="68" rx="12"
              fill="#1683d8" stroke="#333" stroke-width="3"/>
        <rect x="31" y="22" width="38" height="23" rx="5"
              fill="#dff3ff" stroke="#333" stroke-width="2"/>
        <path d="M34 25 Q50 18 66 25 L66 39 L34 39 Z"
              fill="#9ed9f5" stroke="#333" stroke-width="2"/>
        <circle cx="34" cy="18" r="4"
                fill="#fff4a3" stroke="#333" stroke-width="1.5"/>
        <circle cx="66" cy="18" r="4"
                fill="#fff4a3" stroke="#333" stroke-width="1.5"/>
        <rect x="31" y="45" width="38" height="30" rx="5"
              fill="#20a9e8" stroke="#333" stroke-width="2"/>
        <rect x="34" y="49" width="12" height="15" rx="2"
              fill="#dff3ff"/>
        <rect x="54" y="49" width="12" height="15" rx="2"
              fill="#dff3ff"/>
        <circle cx="24" cy="68" r="7"
                fill="#222" stroke="#555" stroke-width="2"/>
        <circle cx="76" cy="68" r="7"
                fill="#222" stroke="#555" stroke-width="2"/>
        <path d="M50 3 L40 15 L60 15 Z"
              fill="#e63946" stroke="#333" stroke-width="1"/>
      </svg>
    </div>
  `,
  iconSize: [70, 70],
  iconAnchor: [35, 35],
  popupAnchor: [0, -35]
});

function updateVehicleRotation(heading) {
  const wrapper = $("vehicleWrapper");
  if (wrapper) {
    wrapper.style.transform = `rotate(${heading}deg)`;
  }
}

function calculateHeading(lat1, lng1, lat2, lng2) {
  const toRad = value => value * Math.PI / 180;
  const phi1 = toRad(lat1);
  const phi2 = toRad(lat2);
  const deltaLng = toRad(lng2 - lng1);

  const y = Math.sin(deltaLng) * Math.cos(phi2);
  const x =
    Math.cos(phi1) * Math.sin(phi2) -
    Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLng);

  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function calculateDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = value => value * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *
    Math.sin(dLng / 2) ** 2;

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/* FIREBASE LOGIN */
async function loginFirebase() {
  try {
    setStatus("🟡 กำลังเข้าสู่ระบบ Firebase...", "warning");
    const result = await signInAnonymously(auth);
    currentUser = result.user;
    setStatus("🟢 เชื่อมต่อ Firebase สำเร็จ", "success");
  } catch (error) {
    console.error("Firebase Login Error:", error);
    setStatus("🔴 เข้าสู่ระบบ Firebase ไม่สำเร็จ: " + error.message, "error");
  }
}

/* START GPS TRACKING */
function startTracking() {
  if (!currentUser) {
    alert("ยังไม่ได้เชื่อมต่อ Firebase กรุณารอสักครู่แล้วลองใหม่");
    return;
  }

  if (!navigator.geolocation) {
    alert("อุปกรณ์นี้ไม่รองรับ GPS");
    return;
  }

  if (watchId !== null) return;

  $("gpsStatus").textContent = "กำลังค้นหาตำแหน่ง...";
  setStatus("🟢 กำลังแชร์ตำแหน่งรถสาย 1314", "success");

  watchId = navigator.geolocation.watchPosition(
    async position => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const speed = position.coords.speed;
      const gpsHeading = position.coords.heading;
      const accuracy = position.coords.accuracy;

      let heading = gpsHeading;

      if (heading == null || !Number.isFinite(heading)) {
        if (lastPosition) {
          const distance = calculateDistance(
            lastPosition.lat, lastPosition.lng, lat, lng
          );

          if (distance > 3) {
            heading = calculateHeading(
              lastPosition.lat, lastPosition.lng, lat, lng
            );
            lastHeading = heading;
          } else {
            heading = lastHeading;
          }
        } else {
          heading = lastHeading;
        }
      } else {
        lastHeading = heading;
      }

      lastPosition = { lat, lng };

      $("latText").textContent = lat.toFixed(6);
      $("lngText").textContent = lng.toFixed(6);
      $("speedText").textContent =
        speed != null && Number.isFinite(speed)
          ? `${Math.max(0, speed * 3.6).toFixed(1)} กม./ชม.`
          : "ไม่ทราบ";
      $("headingText").textContent = `${Math.round(heading)}°`;
      $("accuracyText").textContent =
        accuracy != null ? `${Math.round(accuracy)} เมตร` : "ไม่ทราบ";
      $("timeText").textContent = new Date().toLocaleString("th-TH");
      $("gpsStatus").textContent = "🟢 GPS ทำงานปกติ";

      const positionOnMap = [lat, lng];

      if (!vehicleMarker) {
        vehicleMarker = L.marker(positionOnMap, {
          icon: vehicleIcon,
          zIndexOffset: 1000
        }).addTo(map);

        vehicleMarker.bindPopup(
          "🚐 รถสองแถวสาย 1314<br>ตำแหน่งจาก GPS คนขับ"
        );
      } else {
        vehicleMarker.setLatLng(positionOnMap);
      }

      updateVehicleRotation(heading);

      try {
        await set(vehicleRef, {
          lat,
          lng,
          heading,
          speed: speed != null ? speed : 0,
          accuracy: accuracy != null ? accuracy : 0,
          updatedAt: Date.now(),
          driverUid: currentUser.uid
        });

        setStatus("🟢 แชร์ตำแหน่งรถสาย 1314 สำเร็จ", "success");
      } catch (error) {
        console.error("Firebase Write Error:", error);
        setStatus("🔴 ส่งตำแหน่งไป Firebase ไม่สำเร็จ", "error");
      }
    },

    error => {
      console.error("GPS Error:", error);
      $("gpsStatus").textContent = "🔴 GPS มีปัญหา";

      if (error.code === error.PERMISSION_DENIED) {
        setStatus("🔴 กรุณาอนุญาตการเข้าถึงตำแหน่ง GPS", "error");
      } else if (error.code === error.POSITION_UNAVAILABLE) {
        setStatus("🟡 ไม่สามารถหาตำแหน่ง GPS ได้", "warning");
      } else if (error.code === error.TIMEOUT) {
        setStatus("🟡 GPS ใช้เวลาค้นหานานเกินไป", "warning");
      }
    },

    {
      enableHighAccuracy: true,
      maximumAge: 3000,
      timeout: 15000
    }
  );

  $("startBtn").disabled = true;
  $("stopBtn").disabled = false;
}

/* STOP GPS */
function stopTracking() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  $("gpsStatus").textContent = "หยุดแชร์ตำแหน่ง";
  setStatus("🟡 หยุดแชร์ตำแหน่งแล้ว", "warning");

  $("startBtn").disabled = false;
  $("stopBtn").disabled = true;

  // คงตำแหน่งล่าสุดใน Firebase ไว้ตามเดิม
}

/* LOCATE CURRENT VEHICLE */
$("locateBtn").addEventListener("click", () => {
  if (vehicleMarker) {
    map.setView(vehicleMarker.getLatLng(), 17, { animate: true });
    vehicleMarker.openPopup();
  } else {
    alert("ยังไม่มีตำแหน่งรถ กรุณากดเริ่มแชร์ตำแหน่งก่อน");
  }
});

$("startBtn").addEventListener("click", startTracking);
$("stopBtn").addEventListener("click", stopTracking);

/* INITIALIZE */
loginFirebase();
createRealRoadRoute();
</script>
</body>
</html>
