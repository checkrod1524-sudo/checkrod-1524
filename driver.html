async function createRealRoadRoute() {

  try {

    setStatus(
      "🟡 กำลังโหลดเส้นทางถนนจริงของสาย 1524...",
      "warning"
    );


    /*
      OSRM ต้องการพิกัดในรูปแบบ

    */

    const coordinates =
      routeWaypoints
        .map(
          point =>
            `${point[1]},${point[0]}`
        )
        .join(";");


    const url =
      "https://router.project-osrm.org/route/v1/driving/"
      +
      coordinates
      +
      "?overview=full&geometries=geojson";


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "ไม่สามารถเชื่อมต่อระบบคำนวณเส้นทาง"
      );

    }


    const result =
      await response.json();


    if (
      !result.routes ||
      result.routes.length === 0
    ) {

      throw new Error(
        "ไม่พบเส้นทาง"
      );

    }


    /*
      เอา Geometry จาก OSRM
      ซึ่งเป็นเส้นทางตามถนน
    */

    const roadCoordinates =
      result.routes[0]
        .geometry
        .coordinates
        .map(
          point =>
            [
              point[1],
              point[0]
            ]
        );


    /*
      วาดเส้นถนนจริง
    */

    routeLine =
      L.polyline(

        roadCoordinates,

        {
          color: "#1683d8",

          weight: 7,

          opacity: 0.9,

/* =====================================================
   CALCULATE HEADING
   ===================================================== */

function calculateHeading(
  oldLat,
  oldLng,
  newLat,
  newLng
) {

  const lat1 =
    oldLat *
    Math.PI /
    180;


  const lat2 =
    newLat *
    Math.PI /
    180;


  const dLng =
    (
      newLng -
      oldLng
    ) *
    Math.PI /
    180;


  const y =
    Math.sin(dLng) *
    Math.cos(lat2);


  const x =
    Math.cos(lat1) *
    Math.sin(lat2)
    -
    Math.sin(lat1) *
    Math.cos(lat2) *
    Math.cos(dLng);


  let bearing =
    Math.atan2(
      y,
      x
    ) *
    180 /
    Math.PI;


  bearing =
    (
      bearing +
      360
    ) % 360;


  return bearing;

}



/* =====================================================
   DISTANCE
   ===================================================== */

function calculateDistance(
  lat1,
  lng1,
  lat2,
  lng2
) {

  const R =
    6371000;


  const dLat =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;


  const dLng =
    (
      lng2 -
      lng1
    ) *
    Math.PI /
    180;


  const a =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2)
    +
    Math.cos(
      lat1 *
      Math.PI /
      180
    ) *
    Math.cos(
      lat2 *
      Math.PI /
      180
    ) *
    Math.sin(dLng / 2) *
    Math.sin(dLng / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );


  return R * c;

}

  }


  /*
    SVG หัวรถชี้ขึ้นอยู่แล้ว

    ดังนั้นไม่ต้องบวก 90°

    0° = ขึ้น

    270° = ซ้าย
  */

  wrapper.style.transform =

}

  }

    );

    return;

  }

  );

        /* =================================================

        let heading =

        /*
          บางเครื่องไม่มี heading

          ให้คำนวณจากตำแหน่งก่อนหน้า
        */

        if (
          heading === null ||
          heading === undefined ||
          Number.isNaN(heading)
        ) {

          if (lastPosition) {

            const distance =
              calculateDistance(

                lastPosition.lat,

                lastPosition.lng,

                lat,

                lng

              );


            /*
              ต้องขยับมากกว่า 3 เมตร
              จึงคำนวณทิศทาง
            */

            if (distance > 3) {

              heading =
                calculateHeading(

                  lastPosition.lat,

                  lastPosition.lng,

                  lat,

                  lng

                );


              lastHeading =
                heading;

            }
            else {

              heading =
                lastHeading;

            }

          }
          else {

            heading =
              lastHeading;

          }

        }
        else {

          lastHeading =
            heading;

        }



        /* =================================================
           SAVE LAST POSITION
           ================================================= */

        lastPosition = {

          lat: lat,

          lng: lng

        };



        /* =================================================
           DISPLAY LATITUDE
           ================================================= */

        document.getElementById(
          "latText"
        ).textContent =
          lat.toFixed(6);



        /* =================================================
           DISPLAY LONGITUDE
           ================================================= */

        document.getElementById(
          "lngText"
        ).textContent =
          lng.toFixed(6);



        /* =================================================
           DISPLAY SPEED
           ================================================= */

        if (
          speed !== null &&
          !Number.isNaN(speed)
        ) {

          const kmh =
            Math.max(
              0,
              speed * 3.6
            );


          document.getElementById(
            "speedText"
          ).textContent =
            kmh.toFixed(1)
            +
            " km/h";

        }
        else {

          document.getElementById(
            "speedText"
          ).textContent =
            "ไม่ทราบ";

        }



        /* =================================================
           DISPLAY HEADING
           ================================================= */

        document.getElementById(
          "headingText"
        ).textContent =
          Math.round(
            heading
          )
          +
          "°";



        /* =================================================
           DISPLAY ACCURACY
           ================================================= */

        gpsStatus.textContent =
          "🟢 GPS ทำงานปกติ";



        /* =================================================
           TIME
           ================================================= */

        const now =
          new Date();


        document.getElementById(
          "timeText"
        ).textContent =
          now.toLocaleTimeString(
            "th-TH"
          );



        /* =================================================
           VEHICLE MARKER
           ================================================= */

        const newLatLng =
          [
            lat,
            lng
          ];


        if (!vehicleMarker) {

          vehicleMarker =
            L.marker(

              newLatLng,

              {
                icon:
                  vehicleIcon,

                zIndexOffset:
                  1000
              }

            ).addTo(map);


          vehicleMarker.bindPopup(

            `
              <b>🚐 รถสองแถวสาย 1524</b>
              <br>
              รถกำลังให้บริการ
              <br>
              <small>
                ตำแหน่งจาก GPS คนขับ
              </small>
            `

          );

        }
        else {

          vehicleMarker
            .setLatLng(
              newLatLng
            );

        }



        /* =================================================
           ROTATE VEHICLE
           ================================================= */

        updateVehicleRotation(
          heading
        );



        /* =================================================
           SEND FIREBASE
           ================================================= */

        try {

          const vehicleRef =
            ref(
              db,
              "vehicles/1524"
            );


          await set(

            vehicleRef,

            {

              lat:
                lat,

              lng:
                lng,

              heading:
                heading,

              speed:
                speed !== null
                  ? speed
                  : 0,

              accuracy:
                accuracy !== null
                  ? accuracy
                  : 0,

              updatedAt:
                Date.now(),

              driverUid:
                currentUser.uid

            }

          );


          console.log(
            "ส่งตำแหน่งสำเร็จ:",
            lat,
            lng,
            "heading:",
            heading
          );


          setStatus(
            "🟢 GPS ทำงานและส่งตำแหน่งรถแล้ว",
            "success"
          );

        }

        catch(error) {

          console.error(
            "Firebase Write Error:",
            error
          );


          setStatus(
            "🔴 ส่งตำแหน่งไป Firebase ไม่สำเร็จ",
            "error"
          );

        }

      },



      /* =================================================
         GPS ERROR
         ================================================= */

      (error) => {

        console.error(
          "GPS Error:",
          error
        );


        gpsStatus.textContent =
          "🔴 GPS ไม่ทำงาน";


        if (
          error.code ===
          error.PERMISSION_DENIED
        ) {

          setStatus(
            "🔴 กรุณาอนุญาตการเข้าถึงตำแหน่ง",
            "error"
          );


          alert(
            "กรุณากด Allow / อนุญาตการเข้าถึงตำแหน่งของเว็บไซต์"
          );

        }

        else if (
          error.code ===
          error.POSITION_UNAVAILABLE
        ) {

          setStatus(
            "🟡 ไม่สามารถหาตำแหน่ง GPS ได้",
            "warning"
          );

        }

        else if (
          error.code ===
          error.TIMEOUT
        ) {

          setStatus(
            "🟡 GPS ใช้เวลาค้นหานานเกินไป",
            "warning"
          );

        }

      },


      /* =================================================
         GPS OPTIONS
         ================================================= */

      {

        enableHighAccuracy:
          true,

        maximumAge:
          3000,

        timeout:
          15000

      }

    );



  document.getElementById(
    "startBtn"
  ).disabled =
    true;


  document.getElementById(
    "stopBtn"
  ).disabled =
    false;

}



/* =====================================================
   STOP GPS
   ===================================================== */

async function stopTracking() {

  if (
    watchId !== null
  ) {

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId =
      null;

  }


  gpsStatus.textContent =
    "หยุดแชร์ตำแหน่ง";


  setStatus(
    "🟡 หยุดแชร์ตำแหน่งแล้ว",
    "warning"
  );


  document.getElementById(
    "startBtn"
  ).disabled =
    false;


  document.getElementById(
    "stopBtn"
  ).disabled =
    true;


  /*
    ไม่ลบข้อมูลจาก Firebase

    เพื่อให้ผู้โดยสารเห็น
    ตำแหน่งล่าสุดของรถ
  */

}



/* =====================================================
   LOCATE BUTTON
   ===================================================== */

document.getElementById(
  "locateBtn"
).addEventListener(

  "click",

  () => {

    if (vehicleMarker) {

      map.setView(

        vehicleMarker.getLatLng(),

        17,

        {
          animate:
            true
        }

      );


      vehicleMarker.openPopup();

    }

    else {

      alert(
        "ยังไม่มีตำแหน่งรถ\nกรุณากด เริ่มแชร์ตำแหน่ง ก่อน"
      );

    }

  }

);



/* =====================================================
   BUTTON EVENTS
   ===================================================== */

document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  startTracking
);


document.getElementById(
  "stopBtn"
).addEventListener(
  "click",
  stopTracking
);



/* =====================================================
   START FIREBASE
   ===================================================== */

loginFirebase();



/* =====================================================
   LOAD REAL ROAD ROUTE
   ===================================================== */

createRealRoadRoute();


</script>

</body>
</html>
