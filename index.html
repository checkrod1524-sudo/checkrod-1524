  <script type="module">

    /* ==================================================

    /* ==================================================
       MAP
    ================================================== */

    const map =
      L.map(

      ).setView(

        [13.737, 100.665],

      );


    L.tileLayer(

    /* ==================================================
       จุดตามเส้นทางสาย 1524

       หมู่บ้านนักกีฬาแหลมทอง
       ↓
       กรุงเทพกรีฑา
       ↓
       พัฒนาการ
       ↓
       ศรีนครินทร์
       ↓
       ตลาดเอี่ยมสมบัติ
    ================================================== */

    const routeWaypoints = [

      [13.745854, 100.696101],

      [13.742930, 100.695219],

      [13.740458, 100.693833],

      [13.739544, 100.690282],

      [13.739952, 100.688576],

      [13.740145, 100.688044],

      [13.740543, 100.685578],

      [13.741393, 100.682647],

      [13.741900, 100.679686],

      [13.742378, 100.676413],

      [13.743789, 100.672598],

      [13.745233, 100.669477],

      [13.745907, 100.666696],

      [13.746254, 100.664298],

      [13.747739, 100.656195],

      [13.744938, 100.653463],

      [13.742275, 100.655203],

      [13.735944, 100.651895],

      [13.734123, 100.649745],

      [13.732379, 100.649446],

      [13.730569, 100.653248],

      [13.731453, 100.650834],

      [13.732599, 100.648364],

      [13.733819, 100.645847],

      [13.734139, 100.641249],

      [13.731601, 100.641481],

      [13.729121, 100.641648],

      [13.726341, 100.641860],

      [13.721512, 100.642213],

      [13.713566, 100.643655]

    ];


    /* ==================================================
       เส้นสำรอง
       กรณี Routing ใช้งานไม่ได้
    ================================================== */

    const fallbackRoute =
      L.polyline(

        routeWaypoints,

        {

          color: "#1976d2",

          weight: 6,

          opacity: 0.35,

          dashArray: "10 8"

        }

      ).addTo(map);


    /* ==================================================
       สร้างเส้นตามถนนจริงด้วย OSRM
    ================================================== */

    let routeLine = null;


    async function createRealRoadRoute() {


      try {


        /*
          OSRM ใช้

          longitude,latitude

          จึงต้องสลับ lat/lng
        */

        const coordinates =
          routeWaypoints

            .map(

              point =>

                `${point[1]},${point[0]}`

            )

            .join(";");


        const url =

          `https://router.project-osrm.org/route/v1/driving/${coordinates}?overview=full&geometries=geojson`;


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "Routing ไม่ตอบสนอง"
          );

        }


        const result =
          await response.json();


        if (

          !result.routes ||

          result.routes.length === 0

        ) {

          throw new Error(
            "ไม่พบเส้นทาง"
          );

        }


        const geometry =
          result.routes[0].geometry;


        /*
          GeoJSON

          [lng, lat]

          → Leaflet

          [lat, lng]
        */

        const roadCoordinates =

          geometry.coordinates.map(

            point => [

              point[1],

              point[0]

            ]

          );


        /* ลบเส้นสำรอง */

        if (
          map.hasLayer(
            fallbackRoute
          )
        ) {

          map.removeLayer(
            fallbackRoute
          );

        }


        /* สร้างเส้นจริง */

        routeLine =

          L.polyline(

            roadCoordinates,

            {

              color: "#1976d2",

              weight: 7,

              opacity: 0.9,

              lineCap: "round",

              lineJoin: "round"

            }

          ).addTo(map);


        routeLine.bindTooltip(
          "🛣️ เส้นทางรถสองแถวสาย 1524"
        );


        /*
          แสดงเส้นทางทั้งหมด
        */

        map.fitBounds(

          routeLine.getBounds(),

          {

            padding:
              [30, 30]

          }

        );


        console.log(
          "สร้างเส้นทางตามถนนจริงสำเร็จ"
        );


      }

      catch (error) {


        console.error(
          "Routing Error:",
          error
        );


        /*
          ใช้เส้นสำรอง
        */

        fallbackRoute.setStyle({

          opacity: 0.9

        });


        console.log(
          "ใช้เส้นทางสำรอง"
        );

      }

    }


    /* เริ่มสร้างเส้นทาง */

    createRealRoadRoute();


    /* ==================================================
       จุดต้นทาง
    ================================================== */

    const startPoint =
      routeWaypoints[0];


    L.marker(
      startPoint
    )

      .addTo(map)

      .bindTooltip(

        "🏁 หมู่บ้านนักกีฬาแหลมทอง",

        {

          permanent: true,

          direction: "top",

          className:
            "route-label"

        }

      );


    /* ==================================================
       จุดปลายทาง
    ================================================== */

    const endPoint =

      routeWaypoints[
        routeWaypoints.length - 1
      ];


    L.marker(
      endPoint
    )

      .addTo(map)

      .bindTooltip(

        "🏁 ตลาดเอี่ยมสมบัติ",

        {

          permanent: true,

          direction: "top",

          className:
            "route-label"

        }

      );


    /* ==================================================
       ตัวแปรรถ
    ================================================== */

    let vehicleMarker =
      null;


    let latestVehicleData =
      null;


    let previousLat =
      null;


    let previousLng =
      null;


    let currentBearing =
      0;


    /* ==================================================
       สร้างไอคอนรถ

       จุดสำคัญ:
       GPS heading ไม่เปลี่ยน

       เราแก้เฉพาะหน้าตาของไอคอน
       เพื่อไม่ให้รถกลับหัว
    ================================================== */

    function createVehicleIcon(
      heading
    ) {


      /*
        ปรับองศาให้ตรงกับด้านหน้าของ 🚐

        +180 = กลับด้านจากรูปต้นฉบับ
      */

      let angle =
        (
          heading + 180
        ) % 360;


      /*
        แปลงเป็นช่วง

        -180 ถึง +180
      */

      if (
        angle > 180
      ) {

        angle -= 360;

      }


      /*
        ป้องกันรถกลับหัว

        ถ้าต้องหมุนเกิน 90°
        ให้พลิกรถซ้าย-ขวาแทน

        ทำให้รถยังหันไปทาง
        ที่ถูกต้อง แต่ไม่กลับหัว
      */

      let flip =
        1;


      if (
        angle > 90
      ) {

        angle -= 180;

        flip = -1;

      }


      else if (
        angle < -90
      ) {

        angle += 180;

        flip = -1;

      }


      return L.divIcon({

        className:
          "vehicle-icon",


        html: `

          <div

            class="vehicle-emoji"

            style="

              transform:

                rotate(${angle}deg)

                scaleX(${flip});

            "

          >

            🚐

          </div>

        `,


        iconSize:
          [65, 65],


        iconAnchor:
          [32, 32]

      });

    }


    /* ==================================================
       คำนวณ Bearing
    ================================================== */

    function calculateBearing(

      lat1,

      lng1,

      lat2,

      lng2

    ) {


      const toRad =
        value =>

          value *
          Math.PI /
          180;


      const toDeg =
        value =>

          value *
          180 /
          Math.PI;


      const phi1 =
        toRad(lat1);


      const phi2 =
        toRad(lat2);


      const deltaLambda =

        toRad(
          lng2 - lng1
        );


      const y =

        Math.sin(
          deltaLambda
        ) *

        Math.cos(
          phi2
        );


      const x =

        Math.cos(
          phi1
        ) *

        Math.sin(
          phi2
        )

        -

        Math.sin(
          phi1
        ) *

        Math.cos(
          phi2
        ) *

        Math.cos(
          deltaLambda
        );


      return (

        toDeg(

          Math.atan2(
            y,
            x
          )

        )

        + 360

      ) % 360;

    }


    /* ==================================================
       ชื่อทิศทาง
    ================================================== */

    function getDirectionName(
      heading
    ) {


      if (

        heading >= 337.5 ||

        heading < 22.5

      ) {

        return "เหนือ";

      }


      if (

        heading >= 22.5 &&

        heading < 67.5

      ) {

        return "ตะวันออกเฉียงเหนือ";

      }


      if (

        heading >= 67.5 &&

        heading < 112.5

      ) {

        return "ตะวันออก";

      }


      if (

        heading >= 112.5 &&

        heading < 157.5

      ) {

        return "ตะวันออกเฉียงใต้";

      }


      if (

        heading >= 157.5 &&

        heading < 202.5

      ) {

        return "ใต้";

      }


      if (

        heading >= 202.5 &&

        heading < 247.5

      ) {

        return "ตะวันตกเฉียงใต้";

      }


      if (

        heading >= 247.5 &&

        heading < 292.5

      ) {

        return "ตะวันตก";

      }


      return "ตะวันตกเฉียงเหนือ";

    }


    /* ==================================================
       อัปเดตรถบนแผนที่
    ================================================== */

    function updateVehicleOnMap(

      data,

      moveMap

    ) {


      if (!data) {

        return;

      }


      const lat =
        Number(
          data.lat
        );


      const lng =
        Number(
          data.lng
        );


      if (

        !Number.isFinite(lat) ||

        !Number.isFinite(lng)

      ) {

        return;

      }


      /* ==================================================
         หาทิศทาง
      ================================================== */

      let bearing =
        Number(
          data.heading
        );


      /*
        ถ้า GPS คนขับ
        ไม่ส่ง heading มา

        คำนวณจากตำแหน่งก่อนหน้า
      */

      if (

        !Number.isFinite(
          bearing
        )

      ) {


        if (

          previousLat !== null &&

          previousLng !== null

        ) {


          const moved =

            Math.sqrt(

              Math.pow(

                lat -
                previousLat,

                2

              )

              +

              Math.pow(

                lng -
                previousLng,

                2

              )

            );


          if (

            moved > 0.00001

          ) {


            bearing =

              calculateBearing(

                previousLat,

                previousLng,

                lat,

                lng

              );

          }

        }

      }


      /*
        ถ้ายังไม่มี bearing
        ใช้ทิศล่าสุด
      */

      if (

        !Number.isFinite(
          bearing
        )

      ) {

        bearing =
          currentBearing;

      }


      currentBearing =
        bearing;


      previousLat =
        lat;


      previousLng =
        lng;


      /* ==================================================
         สร้างรถครั้งแรก
      ================================================== */

      if (
        vehicleMarker === null
      ) {


        vehicleMarker =

          L.marker(

            [lat, lng],

            {

              icon:

                createVehicleIcon(
                  bearing
                ),

              zIndexOffset:
                1000

            }

          )

          .addTo(map);


        vehicleMarker.bindPopup(

          `

            <b>
              🚐 รถสองแถวสาย 1524
            </b>

            <br>

            ตำแหน่งปัจจุบันของรถ

          `

        );

      }


      /* ==================================================
         อัปเดตตำแหน่ง
      ================================================== */

      vehicleMarker.setLatLng(

        [lat, lng]

      );


      /* ==================================================
         อัปเดตทิศทางไอคอน
      ================================================== */

      vehicleMarker.setIcon(

        createVehicleIcon(
          bearing
        )

      );


      /* ==================================================
         เลื่อนแผนที่
         เฉพาะตอนกดปุ่มรีเฟรช
      ================================================== */

      if (
        moveMap
      ) {


        map.setView(

          [lat, lng],

          16,

          {

            animate: true

          }

        );

      }


      /* ==================================================
         แสดงข้อมูล GPS
      ================================================== */

      latText.textContent =
        lat.toFixed(6);


      lngText.textContent =
        lng.toFixed(6);


      headingText.textContent =

        `${bearing.toFixed(0)}° (${getDirectionName(bearing)})`;


      /* ==================================================
         ความเร็ว
      ================================================== */

      const speed =
        Number(
          data.speed
        );


      if (

        Number.isFinite(
          speed
        )

      ) {

        speedText.textContent =

          `${speed.toFixed(1)} km/h`;

      }

      else {

        speedText.textContent =
          "-";

      }


      /* ==================================================
         ความแม่นยำ
      ================================================== */

      const accuracy =
        Number(
          data.accuracy
        );


      if (

        Number.isFinite(
          accuracy
        )

      ) {

        accuracyText.textContent =

          `${accuracy.toFixed(1)} เมตร`;

      }

      else {

        accuracyText.textContent =
          "-";

      }


      /* ==================================================
         เวลาอัปเดต
      ================================================== */

      if (
        data.updatedAt
      ) {


        const date =

          new Date(
            data.updatedAt
          );


        timeText.textContent =

          date.toLocaleString(

            "th-TH",

            {

              dateStyle:
                "short",

              timeStyle:
                "medium"

            }

          );

      }

      else {

        timeText.textContent =
          "-";

      }

    }


    /* ==================================================
       Firebase Vehicle Reference
    ================================================== */

    const vehicleRef =

      ref(

        db,

        "vehicles/1524"

      );


    /* ==================================================
       REAL-TIME
    ================================================== */

    onValue(

      vehicleRef,

      snapshot => {


        const data =
          snapshot.val();


        /* =========================
           ไม่มีข้อมูล
        ========================= */

        if (!data) {


          latestVehicleData =
            null;


          statusText.textContent =
            "ยังไม่มีข้อมูลตำแหน่งรถ";


          statusDot.style.background =
            "#999";


          vehicleStatus.textContent =
            "ไม่พบตำแหน่งรถ";


          latText.textContent =
            "-";


          lngText.textContent =
            "-";


          headingText.textContent =
            "-";


          speedText.textContent =
            "-";


          accuracyText.textContent =
            "-";


          timeText.textContent =
            "-";


          return;

        }


        /* =========================
           เก็บข้อมูลล่าสุด
        ========================= */

        latestVehicleData =
          data;


        /* =========================
           แสดงรถ
        ========================= */

        updateVehicleOnMap(

          data,

          false

        );


        /* =========================
           สถานะ
        ========================= */

        statusText.textContent =
          "🟢 เชื่อมต่อและรับตำแหน่งรถแล้ว";


        statusDot.style.background =
          "#22c55e";


        vehicleStatus.textContent =
          "🟢 กำลังให้บริการ";

      },


      error => {


        console.error(
          "Firebase Error:",
          error
        );


        statusText.textContent =
          "🔴 เชื่อมต่อ Firebase ไม่สำเร็จ";


        statusDot.style.background =
          "#ef4444";


        vehicleStatus.textContent =
          "เกิดข้อผิดพลาด";

      }

    );


    /* ==================================================
       ปุ่มรีเฟรช
    ================================================== */

    refreshBtn.addEventListener(

      "click",

      async () => {


        refreshBtn.textContent =
          "🔄 กำลังรีเฟรช...";


        refreshBtn.disabled =
          true;


        try {


          /*
            ดึงข้อมูลล่าสุด
            จาก Firebase โดยตรง
          */

          const snapshot =

            await get(
              vehicleRef
            );


          const data =
            snapshot.val();


          if (data) {


            latestVehicleData =
              data;


            updateVehicleOnMap(

              data,

              true

            );


            statusText.textContent =
              "🟢 รีเฟรชตำแหน่งรถแล้ว";


            statusDot.style.background =
              "#22c55e";


            vehicleStatus.textContent =
              "🟢 กำลังให้บริการ";

          }

          else {


            statusText.textContent =
              "🟡 ยังไม่พบตำแหน่งรถ";


            statusDot.style.background =
              "#f59e0b";


            vehicleStatus.textContent =
              "ยังไม่มีข้อมูล";

          }

        }

        catch (error) {


          console.error(
            "Refresh Error:",
            error
          );


          statusText.textContent =
            "🔴 รีเฟรชไม่สำเร็จ";


          statusDot.style.background =
            "#ef4444";

        }


        setTimeout(

          () => {


            refreshBtn.textContent =
              "🔄 รีเฟรชตำแหน่งรถ";


            refreshBtn.disabled =
              false;


          },

          700

        );

      }

    );


  </script>


</body>

</html>
